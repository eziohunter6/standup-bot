name: daily standup

on:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST (UTC+5:30) Mon–Fri
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve config (private secret > tracked file > example)
        env:
          STANDUP_CONFIG_YAML: ${{ secrets.STANDUP_CONFIG_YAML }}
        run: |
          if [ -n "$STANDUP_CONFIG_YAML" ]; then
            echo "Using config from STANDUP_CONFIG_YAML secret"
            printf '%s' "$STANDUP_CONFIG_YAML" | base64 -d > config.yaml
          elif [ -f config.yaml ]; then
            echo "Using config.yaml from repo"
          else
            cp config.example.yaml config.yaml
          fi

      - name: Generate and post standup
        env:
          GITHUB_PAT: ${{ secrets.STANDUP_GITHUB_PAT }}
          GITHUB_USERNAME: ${{ secrets.STANDUP_GITHUB_USERNAME }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_TEAM_IDS: ${{ secrets.FIGMA_TEAM_IDS }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python standup.py
